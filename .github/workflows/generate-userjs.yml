name: 生成带更新地址的 .user.js 并推送至仓库

on:
  push:
    paths:
      - '☆GM论坛勋章百宝箱.js'
      - '☆GM论坛勋章放大镜.js'
      - '.github/workflows/generate-userjs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 补全更新地址并生成 .user.js
        run: |
          mkdir -p dist

          SCRIPTS=(
            "☆GM论坛勋章百宝箱.js"
            "☆GM论坛勋章放大镜.js"
          )

          for f in "${SCRIPTS[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::warning::文件 $f 不存在，已跳过"
              continue
            fi

            BASENAME=$(basename "$f" .js)
            OUTFILE="dist/${BASENAME}.user.js"

            cp "$f" "$OUTFILE"

            # 如果缺少 @updateURL，自动插入 Gitee 真实链接（文件在 dist/ 下）
            if ! grep -q '@updateURL' "$OUTFILE"; then
              ENCODED_NAME=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${BASENAME}.user.js'))")
              UPDATE_URL="https://gitee.com/cat-fish-X/GM-Script/raw/main/dist/${ENCODED_NAME}"

              sed -i "/^\/\/ @version\b/a // @updateURL    ${UPDATE_URL}\n// @downloadURL  ${UPDATE_URL}" "$OUTFILE"

              echo "✅ 已为 ${BASENAME} 自动添加更新地址：${UPDATE_URL}"
            else
              echo "✓ ${BASENAME} 已包含更新地址"
            fi

            echo "生成文件: $OUTFILE"
          done

      - name: 提交生成的文件到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 先将所有更改加入暂存区
          git add dist/

          # 检查暂存区是否有内容需要提交
          if git diff --staged --quiet; then
            echo "没有文件发生变化，无需提交。"
            exit 0
          fi

          git commit -m "🤖 自动生成 .user.js 文件 [skip ci]"
          git push